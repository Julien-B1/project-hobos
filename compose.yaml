# Docker Compose stack for local development.
#
# Usage goes through the Makefile (`make help`). One service, `app`, runs the
# Vite dev server; one-off commands (tests, lint, build) reuse the same service
# with `docker compose run --rm app <cmd>`.

name: project-hobos

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: project-hobos-dev:latest
    # User that maps to the host user, so generated files are owned by them.
    # The Makefile computes it: host uid/gid with rootful Docker, 0:0 with
    # rootless Docker (where container root IS the host user).
    user: '${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}'
    working_dir: /app
    command: ['pnpm', 'dev']
    ports:
      - '5173:5173'
    volumes:
      # Source tree, including node_modules, so IDE tooling on the host
      # (ESLint, TypeScript language server) sees installed packages.
      - .:/app
      # pnpm store survives container rebuilds and speeds up installs.
      - pnpm-store:/pnpm-store
    environment:
      # Set to "true" if file changes are not detected (e.g. project stored on
      # a Windows drive mounted into WSL). See docs/wiki/Development-Environment.md.
      VITE_USE_POLLING: '${VITE_USE_POLLING:-false}'
    init: true
    tty: true
    stdin_open: true

volumes:
  pnpm-store:
