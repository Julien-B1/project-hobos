# Static server of the production image (deploy/Dockerfile). TLS and the
# public URL are Traefik's job: plain HTTP on port 80 here.
server {
    listen 80 default_server;
    root /srv;

    # Serve the .br / .gz written by the build when the browser accepts them.
    brotli_static on;
    gzip_static on;
    # Requests arrive through Traefik: serve the .gz to proxied requests too.
    gzip_proxied any;
    # Caches must key on Accept-Encoding.
    gzip_vary on;

    # Hashed file names: a new version gets new names, so cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (index.html) is revalidated on each visit.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
